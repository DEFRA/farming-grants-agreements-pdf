version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PRs
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - 'aws*'

      babel:
        patterns:
          - '@babel/*'
          - 'babel*'

      hapi:
        patterns:
          - '@hapi/*'
          - 'hapi-*'

      lint:
        patterns:
          - 'neostandard'
          - 'prettier'
          - 'stylelint'
          - 'stylelint-*'

      logging:
        patterns:
          - '*-pino'
          - '*-pino-format'
          - 'pino'
          - 'pino-*'
          - '@elastic/*'

      testing:
        patterns:
          - '@pact-foundation/*'
          - 'vitest'
          - 'vitest-*'
          - '@vitest/*'
          - 'vitest-fetch-mock'
          - 'vitest-mongodb'

      tools:
        patterns:
          - 'convict'
          - 'convict*'
          - 'husky'
          - 'nodemon'
          - 'npm-run-all'

      types:
        patterns:
          - '@types/*'

    ignore:
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'
      - dependency-name: "@types/node"
        versions: [">=25"] # Use Node LTS

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    # Delay a PR for a package update by 5 days
    cooldown:
      default-days: 5

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update docker packages
  - package-ecosystem: docker
    directory: /

    ignore:
      - dependency-name: "node"
        versions: [">=25"] # Use Node LTS
      - dependency-name: "mongo"
        versions: [">=7.1"] # CDP uses MongoDB 7.0

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    # Delay a PR for an action update by 5 days
    cooldown:
      default-days: 5

  # Update docker-compose packages
  - package-ecosystem: docker-compose
    directory: /

    ignore:
      - dependency-name: "node"
        versions: [">=25"] # Use Node LTS
      - dependency-name: "mongo"
        versions: [">=7.1"] # CDP uses MongoDB 7.0

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    # Delay a PR for an action update by 5 days
    cooldown:
      default-days: 5

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    # Delay a PR for an action update by 5 days
    cooldown:
      default-days: 5
